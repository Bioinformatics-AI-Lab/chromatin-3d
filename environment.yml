name: chromatin-3d
channels: [conda-forge, bioconda]
dependencies:
  # macs2 is not reliably packaged for py3.11+; 3.10 keeps the ENCODE-standard
  # peak caller working alongside current cooltools.
  - python=3.10
  - samtools>=1.19
  - htslib          # bgzip, tabix
  - bedtools
  - macs2
  - deeptools
  - pairtools
  - cooler
  - cooltools
  - bioframe
  - pysam
  - pyyaml
  - pyarrow         # parquet
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - statsmodels
  - jupyterlab
  - curl
